<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service A — OpenShard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, monospace;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #1d4ed8;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background: #1e3a8a;
      color: #93c5fd;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.3rem; color: #93c5fd; margin-bottom: 0.5rem; }
    p  { font-size: 0.85rem; color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .info { background: #0f172a; border-radius: 8px; padding: 1rem; font-size: 0.75rem; color: #64748b; }
    .info span { color: #93c5fd; }
    .service-label {
      font-size: 3rem;
      font-weight: 900;
      color: #3b82f6;
      text-align: center;
      padding: 1rem 0;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Live</div>
    <div class="service-label">Service A</div>
    <h1>OpenShard — Volunteer Node</h1>
    <p>This page is being served from a volunteer host participating in the OpenShard distributed hosting network.</p>
    <div class="info">
      Routed via <span>openshrd.danlara.com.br</span> · Volunteer 01
    </div>
  </div>
</body>
</html>
