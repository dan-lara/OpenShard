[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

; ── HAProxy ──────────────────────────────────────────────────────────────────
[program:haproxy]
command=haproxy -f /etc/haproxy/haproxy.cfg -W -db
autostart=true
autorestart=true
startretries=5
startsecs=2
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Registrar ─────────────────────────────────────────────────────────────────
; Waits for HAProxy to be up before starting (via depends_on equivalent: priority).
[program:registrar]
command=/opt/openshard/registrar
directory=/opt/openshard
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=20
environment=
    RUST_LOG="%(ENV_RUST_LOG)s",
    HAPROXY_CFG="%(ENV_HAPROXY_CFG)s",
    HAPROXY_SOCKET="%(ENV_HAPROXY_SOCKET)s",
    OPENSHARD_DB="%(ENV_OPENSHARD_DB)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0