global
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend openshrd
    bind *:80
    default_backend volunteers

frontend prometheus
    bind *:8405
    http-request use-service prometheus-exporter if { path /metrics }
    no log

backend volunteers
    balance leastconn
    option http-server-close

